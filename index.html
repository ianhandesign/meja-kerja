// ============================================================
// Storan: localStorage pelayar (peranti ini sahaja), meniru API
// window.storage asal supaya kod komponen di bawah tak perlu ubah.
// ============================================================
window.storage = {
  async get(key) {
    const raw = window.localStorage.getItem(key);
    if (raw === null) throw new Error("Kunci tiada: " + key);
    return { key, value: raw, shared: false };
  },
  async set(key, value) {
    try {
      window.localStorage.setItem(key, value);
      return { key, value, shared: false };
    } catch (e) {
      return null;
    }
  },
};

// ---- Tarikh tempatan (BUKAN UTC) ----
// .toISOString() menukar ke UTC dan boleh anjak tarikh 1 hari untuk zon
// waktu +ve seperti Malaysia (UTC+8). Fungsi ini kekalkan tarikh tempatan
// sebenar (tahun-bulan-hari) tanpa penukaran zon waktu.
function localDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

// ---- Eksport CSV (buka terus dalam Apple Numbers / Excel) ----
function toCSV(headers, rows) {
  const esc = (v) => {
    const s = (v ?? "").toString();
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  return [headers, ...rows].map((r) => r.map(esc).join(",")).join("\n");
}

function downloadCSV(filename, headers, rows) {
  // BOM di depan memastikan Numbers/Excel baca aksara & koma dengan betul
  const csv = "\uFEFF" + toCSV(headers, rows);
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${filename}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ---- Gambar pakaian: kecilkan & mampatkan sebelum disimpan ----
// Ambil terus dari kamera iPhone (capture="environment"), lalu lukis
// pada <canvas> pada resolusi kecil (maks ~200px) supaya storan
// peribadi jimat ruang — cukup untuk kenal pasti pakaian, bukan foto
// kualiti penuh.
function resizeImageFile(file, maxDim = 200, quality = 0.55) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Gagal baca fail"));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error("Gagal muat gambar"));
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round((height * maxDim) / width); width = maxDim; }
        else if (height >= width && height > maxDim) { width = Math.round((width * maxDim) / height); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ---- Lampiran dokumen PDF (borang kebenaran, dsb.) ----
// Disimpan sebagai base64 terus (PDF tak boleh dikecilkan macam gambar),
// jadi dihadkan saiznya supaya tidak memenuhi storan peribadi yang
// dikongsi oleh SEMUA rekod ketidakhadiran dalam satu kunci storan.
const MAX_PDF_BYTES = 3 * 1024 * 1024; // 3MB

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Gagal baca fail"));
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

// ---- Kumpulan mengikut minggu (Isnin–Ahad) untuk paparan pakaian ----
const HARI_SINGKAT = ["Isn", "Sel", "Rab", "Kha", "Jum", "Sab", "Ahd"];

function weekStartOf(dateStr) {
  const d = new Date(`${dateStr}T00:00:00`);
  const offset = (d.getDay() + 6) % 7; // Isnin = 0
  d.setDate(d.getDate() - offset);
  return localDateStr(d);
}

function weekLabel(weekStartStr) {
  const start = new Date(`${weekStartStr}T00:00:00`);
  const end = new Date(start);
  end.setDate(start.getDate() + 6);
  const fmt = (d) => d.toLocaleDateString("ms-MY", { day: "numeric", month: "short" });
  return `${fmt(start)} – ${fmt(end)}`;
}

function groupByWeek(items) {
  const map = new Map();
  for (const it of items) {
    if (!it.tarikh) continue;
    const key = weekStartOf(it.tarikh);
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(it);
  }
  return [...map.entries()].sort((a, b) => (a[0] < b[0] ? 1 : -1));
}

function useCollection(key) {
  const [items, setItems] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const res = await window.storage.get(key, false);
        if (!cancelled) setItems(res ? JSON.parse(res.value) : []);
      } catch {
        if (!cancelled) setItems([]);
      }
    })();
    return () => { cancelled = true; };
  }, [key]);

  const persist = useCallback(async (next) => {
    setItems(next);
    try {
      const res = await window.storage.set(key, JSON.stringify(next), false);
      if (!res) setError("Gagal menyimpan. Cuba lagi.");
      else setError(null);
    } catch {
      setError("Gagal menyimpan. Cuba lagi.");
    }
  }, [key]);

  return { items, setItems: persist, error };
}

function GantiSection({ items, setItems, error }) {
  const accent = ACCENTS.ganti;
  const [form, setForm] = useState({ kelasAsal: "", tarikhAsal: "", masaAsal: "", sebab: "", catatan: "" });
  const [askingId, setAskingId] = useState(null); // id item yang sedang diminta tarikh & masa ganti
  const [dateDraft, setDateDraft] = useState("");
  const [timeDraft, setTimeDraft] = useState("");

  const add = () => {
    if (!form.kelasAsal.trim()) return;
    setItems([{ id: uid(), ...form, tarikhGanti: "", masaGanti: "", selesai: false }, ...(items || [])]);
    setForm({ kelasAsal: "", tarikhAsal: "", masaAsal: "", sebab: "", catatan: "" });
  };
  const remove = (id) => setItems((items || []).filter((i) => i.id !== id));
  const list = items || [];

  // Tekan status "Belum Diganti" -> minta tarikh & masa dahulu sebelum tanda selesai.
  // Tekan status "Sudah Diganti" -> terus kembali ke belum (tiada perlu tanya apa-apa).
  const markPending = (it) => {
    if (it.selesai) {
      setItems(list.map((i) => (i.id === it.id ? { ...i, selesai: false } : i)));
      return;
    }
    setAskingId(it.id);
    setDateDraft(it.tarikhGanti || localDateStr(new Date()));
    setTimeDraft(it.masaGanti || "");
  };

  const confirmDate = (id) => {
    if (!dateDraft) return;
    setItems(list.map((i) => (i.id === id ? { ...i, tarikhGanti: dateDraft, masaGanti: timeDraft, selesai: true } : i)));
    setAskingId(null);
    setDateDraft("");
    setTimeDraft("");
  };
  const cancelAsk = () => { setAskingId(null); setDateDraft(""); setTimeDraft(""); };

  return (
    <SectionShell id="ganti" accent={accent} icon={RefreshCw} tag="Ganti"
      title="Kelas Ganti"
      subtitle="Log kuliah tergendala & status penggantian"
      count={list.filter((i) => !i.selesai).length}
      onExport={() => downloadCSV(CSV_CONFIGS.ganti.filename, CSV_CONFIGS.ganti.headers, list.map(CSV_CONFIGS.ganti.map))}>

                  <p className="truncate text-[11.5px] text-black/40">
                    {it.sebab}
                    {it.selesai && it.tarikhGanti && `${it.sebab ? " · " : ""}Ganti: ${it.tarikhGanti}`}{it.selesai && it.masaGanti && ` ${it.masaGanti}`}

              </div>
              {it.catatan && <p className="mt-1 text-[12px] italic text-black/40">📝 {it.catatan}</p>}

              {askingId === it.id && (
                <div className="mt-2 flex flex-wrap items-center gap-2 rounded-lg border border-black/[0.06] bg-white px-2.5 py-2">

                    Batal

          ))}
        </ul>
      )}
    </SectionShell>
  );
}

// ---- Modul 3: Ketidakhadiran ----
const KETIDAKHADIRAN_KOSONG = { nama: "", kelas: "", tarikh: "", masa: "", sebab: "", status: "Belum Disahkan", catatan: "", dokumenPdf: null, dokumenNama: "" };

function KetidakhadiranSection({ items, setItems, error }) {
  const accent = ACCENTS.hadir;
  const [form, setForm] = useState(KETIDAKHADIRAN_KOSONG);
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState(null);
  const [pdfErr, setPdfErr] = useState(null);
  const [pdfUploading, setPdfUploading] = useState(false);
  const addFileRef = React.useRef(null);
  const editFileRef = React.useRef(null);

  const handlePdfFile = async (file, applyFn) => {
    if (!file) return;
    if (file.type !== "application/pdf") { setPdfErr("Hanya fail PDF dibenarkan."); return; }
    if (file.size > MAX_PDF_BYTES) { setPdfErr("Fail melebihi 3MB — guna PDF lebih kecil (cuba imbas resolusi rendah)."); return; }
    setPdfErr(null);
    setPdfUploading(true);
    try {
      const dataUrl = await readFileAsDataURL(file);
      applyFn(dataUrl, file.name);
    } catch {
      setPdfErr("Gagal muat naik fail.");
    } finally {
      setPdfUploading(false);
    }
  };

  const add = () => {
    if (!form.nama.trim()) return;
    setItems([{ id: uid(), ...form }, ...(items || [])]);
    setForm(KETIDAKHADIRAN_KOSONG);
  };
  const cycleStatus = (id) => {
    const order = ["Belum Disahkan", "Disahkan", "Ditolak"];
    setItems((items || []).map((i) => {
      if (i.id !== id) return i;
      return { ...i, status: order[(order.indexOf(i.status) + 1) % order.length] };
    }));
  };
  const remove = (id) => setItems((items || []).filter((i) => i.id !== id));
  const list = items || [];
  const statusColor = { "Belum Disahkan": "#B45309", "Disahkan": "#0B5E56", "Ditolak": "#9F1239" };

  const startEdit = (it) => { setEditingId(it.id); setEditForm({ ...it }); setPdfErr(null); };
  const cancelEdit = () => { setEditingId(null); setEditForm(null); setPdfErr(null); };
  const saveEdit = () => {
    if (!editForm.nama.trim()) return;
    setItems(list.map((i) => (i.id === editingId ? { ...editForm } : i)));
    setEditingId(null);
    setEditForm(null);
  };

  return (
    <SectionShell id="ketidakhadiran" accent={accent} icon={UserX} tag="Ketidakhadiran"
      title="Dokumen Ketidakhadiran Pelajar"
      subtitle="Rekod pelajar tidak hadir, status pengesahan & lampiran borang"
      count={list.filter((i) => i.status === "Belum Disahkan").length}
      onExport={() => downloadCSV(CSV_CONFIGS.hadir.filename, CSV_CONFIGS.hadir.headers, list.map(CSV_CONFIGS.hadir.map))}>
      <div className="mb-3 grid grid-cols-2 gap-2 sm:grid-cols-3">
        <input value={form.nama} onChange={(e) => setForm({ ...form, nama: e.target.value })} placeholder="Nama pelajar" className={fieldCls} />
        <input value={form.kelas} onChange={(e) => setForm({ ...form, kelas: e.target.value })} placeholder="Kelas" className={fieldCls} />
        <input value={form.sebab} onChange={(e) => setForm({ ...form, sebab: e.target.value })} placeholder="Sebab" className={fieldCls} />
        <input type="date" value={form.tarikh} onChange={(e) => setForm({ ...form, tarikh: e.target.value })} className={fieldCls} />
        <input type="time" value={form.masa} onChange={(e) => setForm({ ...form, masa: e.target.value })} className={fieldCls} />
        <input value={form.catatan} onChange={(e) => setForm({ ...form, catatan: e.target.value })} placeholder="Catatan (pilihan)" className={fieldCls} />
      </div>

      <div className="mb-3 flex flex-wrap items-center gap-2">
        <input ref={addFileRef} type="file" accept="application/pdf" className="hidden"
          onChange={(e) => { const f = e.target.files?.[0]; e.target.value = ""; handlePdfFile(f, (dataUrl, name) => setForm((p) => ({ ...p, dokumenPdf: dataUrl, dokumenNama: name }))); }} />
        <button type="button" onClick={() => addFileRef.current?.click()} disabled={pdfUploading}
          className="flex items-center gap-1.5 rounded-lg border border-black/[0.09] bg-white px-2.5 py-2 text-[12.5px] font-medium text-black/60 transition hover:bg-black/[0.03] disabled:opacity-50">
          <Paperclip size={14} /> {pdfUploading ? "Memuat naik…" : form.dokumenPdf ? "Tukar PDF" : "Lampir Borang PDF (pilihan)"}
        </button>
        {form.dokumenPdf && (
          <span className="flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[11.5px]" style={{ backgroundColor: accent.tint, color: accent.deep }}>
            📄 {form.dokumenNama}
            <button type="button" onClick={() => setForm((p) => ({ ...p, dokumenPdf: null, dokumenNama: "" }))} aria-label="Buang PDF" className="text-black/30 hover:text-black/60">
              <X size={12} />
            </button>
          </span>
        )}
      </div>
      {pdfErr && <p className="mb-2 text-[12px] text-rose-600">{pdfErr}</p>}

      <AddBtn onClick={add} accent={accent} />
      {error && <p className="mb-2 text-[12px] text-rose-600">{error}</p>}
      {items === null ? (
        <p className="text-[12.5px] text-black/35">Memuatkan…</p>
      ) : list.length === 0 ? (
        <EmptyRow text="Tiada rekod ketidakhadiran." />
      ) : (
        <ul className="space-y-1.5">
          {list.map((it) =>
            editingId === it.id ? (
              <li key={it.id} className="rounded-xl border border-black/[0.08] bg-white px-3 py-3">
                <div className="mb-2 grid grid-cols-2 gap-2 sm:grid-cols-3">
                  <input value={editForm.nama} onChange={(e) => setEditForm({ ...editForm, nama: e.target.value })} placeholder="Nama pelajar" className={fieldCls} />
                  <input value={editForm.kelas} onChange={(e) => setEditForm({ ...editForm, kelas: e.target.value })} placeholder="Kelas" className={fieldCls} />
                  <input value={editForm.sebab} onChange={(e) => setEditForm({ ...editForm, sebab: e.target.value })} placeholder="Sebab" className={fieldCls} />
                  <input type="date" value={editForm.tarikh} onChange={(e) => setEditForm({ ...editForm, tarikh: e.target.value })} className={fieldCls} />
                  <input type="time" value={editForm.masa} onChange={(e) => setEditForm({ ...editForm, masa: e.target.value })} className={fieldCls} />
                  <input value={editForm.catatan} onChange={(e) => setEditForm({ ...editForm, catatan: e.target.value })} placeholder="Catatan (pilihan)" className={fieldCls} />
                </div>
                <div className="mb-2 flex flex-wrap items-center gap-2">
                  <input ref={editFileRef} type="file" accept="application/pdf" className="hidden"
                    onChange={(e) => { const f = e.target.files?.[0]; e.target.value = ""; handlePdfFile(f, (dataUrl, name) => setEditForm((p) => ({ ...p, dokumenPdf: dataUrl, dokumenNama: name }))); }} />
                  <button type="button" onClick={() => editFileRef.current?.click()} disabled={pdfUploading}
                    className="flex items-center gap-1.5 rounded-lg border border-black/[0.09] bg-white px-2.5 py-2 text-[12.5px] font-medium text-black/60 transition hover:bg-black/[0.03] disabled:opacity-50">
                    <Paperclip size={14} /> {pdfUploading ? "Memuat naik…" : editForm.dokumenPdf ? "Tukar PDF" : "Lampir Borang PDF"}
                  </button>
                  {editForm.dokumenPdf && (
                    <span className="flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[11.5px]" style={{ backgroundColor: accent.tint, color: accent.deep }}>
                      📄 {editForm.dokumenNama}
                      <button type="button" onClick={() => setEditForm((p) => ({ ...p, dokumenPdf: null, dokumenNama: "" }))} aria-label="Buang PDF" className="text-black/30 hover:text-black/60">
                        <X size={12} />
                      </button>
                    </span>
                  )}
                </div>
                {pdfErr && <p className="mb-2 text-[12px] text-rose-600">{pdfErr}</p>}
                <div className="flex items-center gap-2">
                  <button onClick={saveEdit} className="rounded-full px-3 py-1.5 text-[12px] font-semibold text-white" style={{ backgroundColor: accent.mid }}>
                    Simpan
                  </button>
                  <button onClick={cancelEdit} className="rounded-full px-3 py-1.5 text-[12px] font-medium text-black/40 hover:bg-black/5">
                    Batal
                  </button>
                </div>
              </li>
            ) : (
              <li key={it.id} className="rounded-xl bg-black/[0.02] px-3 py-2">
                <div className="flex items-center gap-3">
                  <div className="min-w-0 flex-1">
                    <p className="truncate text-[13px] text-black/80">{it.nama} <span className="text-black/40">· {it.kelas}</span></p>
                    <p className="truncate text-[11.5px] text-black/40">{it.tarikh}{it.masa ? ` ${it.masa}` : ""}{it.sebab && ` · ${it.sebab}`}</p>
                  </div>
                  <button onClick={() => cycleStatus(it.id)}
                    className="shrink-0 rounded-full px-2.5 py-1 text-[11px] font-semibold"
                    style={{ backgroundColor: "white", color: statusColor[it.status], border: `1px solid ${statusColor[it.status]}40` }}>
                    {it.status}
                  </button>
                  <IconBtn onClick={() => startEdit(it)} label="Edit"><Pencil size={13} /></IconBtn>
                  <IconBtn onClick={() => remove(it.id)} label="Buang"><X size={14} /></IconBtn>
                </div>
                {(it.catatan || it.dokumenPdf) && (
                  <div className="mt-1.5 flex flex-wrap items-center gap-2 pl-0.5">
                    {it.catatan && <p className="text-[12px] italic text-black/40">📝 {it.catatan}</p>}
                    {it.dokumenPdf && (
                      <a href={it.dokumenPdf} download={it.dokumenNama || "dokumen.pdf"}
                        className="flex items-center gap-1 rounded-full px-2 py-0.5 text-[11px] font-medium"
                        style={{ backgroundColor: accent.tint, color: accent.deep }}>
                        <Download size={11} /> {it.dokumenNama || "dokumen.pdf"}
                      </a>
                    )}
                  </div>
                )}
              </li>
            )
          )}
        </ul>
      )}
    </SectionShell>
  );
}

// ---- Modul 4: Pakaian ----
function PakaianSection({ items, setItems, error }) {
  const accent = ACCENTS.pakaian;
  const todayLabel = localDateStr(new Date());
  const [form, setForm] = useState({ tarikh: todayLabel, konteks: "Kuliah", labelLain: "", pakaian: "", foto: null, catatan: "" });
  const [uploading, setUploading] = useState(false);
  const [photoErr, setPhotoErr] = useState(null);
  const fileInputRef = React.useRef(null);

  const handlePhoto = async (e) => {
    const file = e.target.files?.[0];
    e.target.value = ""; // benarkan pilih fail sama semula
    if (!file) return;
    setUploading(true);
    setPhotoErr(null);
    try {
      const dataUrl = await resizeImageFile(file);
      setForm((f) => ({ ...f, foto: dataUrl }));
    } catch {
      setPhotoErr("Gagal proses gambar. Cuba lagi.");
    } finally {
      setUploading(false);
    }
  };

  const add = () => {
    if (!form.pakaian.trim()) return;
    setItems([{ id: uid(), ...form }, ...(items || [])]);
    setForm({ ...form, pakaian: "", labelLain: "", foto: null, catatan: "" });
  };
  const remove = (id) => setItems((items || []).filter((i) => i.id !== id));
  const list = items || [];
  const weeks = groupByWeek(list);

  return (
    <SectionShell id="pakaian" accent={accent} icon={Shirt} tag="Pakaian"
      title="Rekod Pakaian"
      subtitle="Snap dari kamera — imej dikecilkan automatik untuk jimat ruang"
      count={list.length}
      onExport={() => downloadCSV(CSV_CONFIGS.pakaian.filename, CSV_CONFIGS.pakaian.headers, list.map(CSV_CONFIGS.pakaian.map))}>

      <div className="mb-3 flex flex-wrap items-center gap-2">
        <input type="date" value={form.tarikh} onChange={(e) => setForm({ ...form, tarikh: e.target.value })} className={fieldCls} />
        <select value={form.konteks} onChange={(e) => setForm({ ...form, konteks: e.target.value })} className={fieldCls}>
          <option>Kuliah</option>
          <option>Kelas Online</option>
          <option>Praktikum</option>
          <option>Lain-lain</option>
        </select>
        {form.konteks === "Lain-lain" && (
          <input value={form.labelLain} onChange={(e) => setForm({ ...form, labelLain: e.target.value })}
            placeholder="cth: Cuti, Hujung Minggu, Mesyuarat" className={fieldCls} />
        )}
        <input value={form.pakaian} onChange={(e) => setForm({ ...form, pakaian: e.target.value })} placeholder="Deskripsi pakaian"
          className={`${fieldCls} min-w-[9rem] flex-1`} />
        <input value={form.catatan} onChange={(e) => setForm({ ...form, catatan: e.target.value })} placeholder="Catatan (pilihan)"
          className={`${fieldCls} min-w-[9rem] flex-1`} />

        <input ref={fileInputRef} type="file" accept="image/*" capture="environment" onChange={handlePhoto} className="hidden" />
        <button
          type="button"
          onClick={() => fileInputRef.current?.click()}
          disabled={uploading}
          className="flex items-center gap-1.5 rounded-lg border border-black/[0.09] bg-white px-2.5 py-2 text-[12.5px] font-medium text-black/60 transition hover:bg-black/[0.03] disabled:opacity-50"
        >
          <Camera size={14} /> {uploading ? "Memproses…" : form.foto ? "Tukar" : "Ambil Gambar"}
        </button>

        {form.foto && (
          <div className="relative h-10 w-10 shrink-0 overflow-hidden rounded-lg border border-black/10">
            <img src={form.foto} alt="Pratonton pakaian" className="h-full w-full object-cover" />
            <button type="button" onClick={() => setForm((f) => ({ ...f, foto: null }))} aria-label="Buang gambar"
              className="absolute inset-0 flex items-center justify-center bg-black/40 text-white opacity-0 transition hover:opacity-100">
              <X size={14} />
            </button>
          </div>
        )}
      </div>
      {photoErr && <p className="mb-2 text-[12px] text-rose-600">{photoErr}</p>}

      <AddBtn onClick={add} accent={accent} />
      {error && <p className="mb-2 text-[12px] text-rose-600">{error}</p>}

      {items === null ? (
        <p className="text-[12.5px] text-black/35">Memuatkan…</p>
      ) : list.length === 0 ? (
        <EmptyRow text="Belum ada rekod pakaian." />
      ) : (
        <div className="space-y-5">
          {weeks.map(([weekStart, weekItems]) => {
            // Peta setiap hari (Isn–Ahd) minggu ini kepada entri, supaya
            // hari-hari lain dalam minggu yang sama terus kelihatan.
            const byDay = {};
            for (const it of weekItems) byDay[it.tarikh] = byDay[it.tarikh] ? [...byDay[it.tarikh], it] : [it];
            const start = new Date(`${weekStart}T00:00:00`);

            return (
              <div key={weekStart}>
                <p className="mb-2 text-[11px] font-semibold uppercase tracking-wider text-black/35">Minggu {weekLabel(weekStart)}</p>
                <div className="mb-3 grid grid-cols-7 gap-1.5">
                  {HARI_SINGKAT.map((label, i) => {
                    const d = new Date(start);
                    d.setDate(start.getDate() + i);
                    const dateStr = localDateStr(d);
                    const dayItems = byDay[dateStr] || [];
                    const first = dayItems[0];
                    return (
                      <div key={dateStr} className="text-center">
                        <div
                          className="mx-auto flex h-12 w-12 items-center justify-center overflow-hidden rounded-lg border sm:h-14 sm:w-14"
                          style={{ borderColor: first ? `${accent.mid}55` : "rgba(0,0,0,0.06)", backgroundColor: first ? "white" : "rgba(0,0,0,0.02)" }}
                        >
                          {first?.foto ? (
                            <img src={first.foto} alt={`Pakaian ${label}`} className="h-full w-full object-cover" />
                          ) : first ? (
                            <Shirt size={16} className="text-black/20" />
                          ) : (
                            <span className="text-black/15">·</span>
                          )}
                        </div>
                        <p className="mt-1 text-[10px] font-medium text-black/35">{label}</p>
                        {dayItems.length > 1 && <p className="text-[9px] text-black/30">+{dayItems.length - 1}</p>}
                      </div>
                    );
                  })}
                </div>

                <ul className="space-y-1.5">
                  {weekItems.map((it) => (
                    <li key={it.id} className="rounded-xl bg-black/[0.02] px-3 py-2">
                      <div className="flex items-center gap-3">
                        {it.foto ? (
                          <img src={it.foto} alt="Pakaian" className="h-8 w-8 shrink-0 rounded-md object-cover" />
                        ) : (
                          <div className="flex h-8 w-8 shrink-0 items-center justify-center rounded-md bg-black/[0.03]">
                            <ImageIcon size={13} className="text-black/20" />
                          </div>
                        )}
                        <span className="w-20 shrink-0 text-[12px] text-black/40">{it.tarikh}</span>
                        <span className="w-20 shrink-0 truncate text-[11px] font-semibold uppercase tracking-wide" style={{ color: accent.mid }}>
                          {it.konteks === "Lain-lain" && it.labelLain ? it.labelLain : it.konteks}
                        </span>
                        <span className="min-w-0 flex-1 truncate text-[13px] text-black/80">{it.pakaian}</span>
                        <IconBtn onClick={() => remove(it.id)} label="Buang"><X size={14} /></IconBtn>
                      </div>
                      {it.catatan && <p className="mt-1 pl-11 text-[12px] italic text-black/40">📝 {it.catatan}</p>}
                    </li>
                  ))}
                </ul>
              </div>
            );
          })}
        </div>
      )}
    </SectionShell>
  );
}

// ---- Modal "Lihat Data Mentah" — akses terus tanpa perlu eksport ----
function RawDataModal({ groups, onClose }) {
  const [copiedKey, setCopiedKey] = useState(null);

  const copy = async (key, text) => {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      // sandaran untuk pelayar lama: guna textarea sementara
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
    setCopiedKey(key);
    setTimeout(() => setCopiedKey((k) => (k === key ? null : k)), 1500);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/60 p-0 sm:items-center sm:p-4" onClick={onClose}>
      <div
        className="max-h-[85vh] w-full max-w-2xl overflow-y-auto rounded-t-2xl bg-[#101826] sm:rounded-2xl"
        onClick={(e) => e.stopPropagation()}
      >
        <div className="sticky top-0 flex items-center justify-between border-b border-white/10 bg-[#101826] px-5 py-4">
          <h3 className="text-[15px] font-semibold text-white" style={{ fontFamily: "'Fraunces', Georgia, serif" }}>Data Mentah</h3>
          <button onClick={onClose} className="flex h-7 w-7 items-center justify-center rounded-full text-white/50 hover:bg-white/10 hover:text-white">
            <X size={16} />
          </button>
        </div>
        <div className="space-y-4 p-5">
          {groups.map(({ key, label, accent, items }) => {
            const text = JSON.stringify(items || [], null, 2);
            return (
              <div key={key}>
                <div className="mb-1.5 flex items-center justify-between">
                  <p className="text-[11px] font-semibold uppercase tracking-wider" style={{ color: accent.glow }}>{label} · {(items || []).length} rekod</p>
                  <button onClick={() => copy(key, text)}
                    className="flex items-center gap-1 rounded-full px-2 py-1 text-[11px] font-medium text-white/60 hover:bg-white/10 hover:text-white">
                    <Copy size={11} /> {copiedKey === key ? "Disalin!" : "Salin"}
                  </button>
                </div>
                <pre className="max-h-40 overflow-y-auto whitespace-pre-wrap break-all rounded-lg bg-black/30 p-3 text-[11px] leading-relaxed text-white/70 select-text">{text}</pre>
              </div>
            );
          })}
          <p className="pt-1 text-[11px] text-white/30">Tekan teks untuk pilih manual, atau guna butang Salin di setiap bahagian.</p>
        </div>
      </div>
    </div>
  );
}

// ---- Bar statistik ringkas (tiada library carta — CSS sahaja) ----
function StatBar({ label, count, total, color }) {
  const pct = total > 0 ? Math.round((count / total) * 100) : 0;
  return (
    <div>
      <div className="mb-1 flex items-center justify-between text-[12px] text-black/55">
        <span>{label}</span>
        <span className="font-medium text-black/70">{count} · {pct}%</span>
      </div>
      <div className="h-2 overflow-hidden rounded-full bg-black/[0.06]">
        <div className="h-2 rounded-full transition-all" style={{ width: `${pct}%`, backgroundColor: color }} />
      </div>
    </div>
  );
}

// ---- Modul 5: Rumusan & Analisis ----
function RumusanSection({ jadual, ganti, hadir, pakaian }) {
  const accent = ACCENTS.rumusan;
  const totalSemua = jadual.length + ganti.length + hadir.length + pakaian.length;

  const jenisList = ["Kuliah", "Kelas Online", "Praktikum", "Penilaian Praktikum"];
  const jadualByJenis = jenisList.map((j) => ({ label: j, count: jadual.filter((i) => i.jenis === j).length })).filter((j) => j.count > 0);

  const gantiSudah = ganti.filter((i) => i.selesai).length;
  const gantiBelum = ganti.length - gantiSudah;

  const statusList = ["Belum Disahkan", "Disahkan", "Ditolak"];
  const hadirByStatus = statusList.map((s) => ({ label: s, count: hadir.filter((i) => i.status === s).length }));

  const absentCounts = {};
  hadir.forEach((i) => { if (i.nama) absentCounts[i.nama] = (absentCounts[i.nama] || 0) + 1; });
  const topAbsent = Object.entries(absentCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);

  // ---- Analisis silang: Jadual + Ganti (hari mengajar sebenar) vs Pakaian ----
  // "Hari mengajar" = tarikh jadual yang diisi, digabung dengan tarikh kelas
  // ganti yang SUDAH selesai (bukan tarikh asal, sebab kelas asal tak jalan).
  const teachingDates = new Set();
  jadual.forEach((j) => { if (j.tarikh) teachingDates.add(j.tarikh); });
  ganti.forEach((g) => { if (g.selesai && g.tarikhGanti) teachingDates.add(g.tarikhGanti); });
  const teachingDatesArr = [...teachingDates].sort((a, b) => (a < b ? 1 : -1));

  const pakaianDates = new Set(pakaian.map((p) => p.tarikh).filter(Boolean));
  const liputanCount = teachingDatesArr.filter((d) => pakaianDates.has(d)).length;
  const liputanMissing = teachingDatesArr.filter((d) => !pakaianDates.has(d));

  // ---- Senarai gabungan: setiap hari mengajar (Jadual + Ganti) dipadankan
  // TERUS dengan rekod pakaian pada tarikh yang sama — cth "18hb Kuliah ->
  // pakaian apa" dan "19hb Kelas Ganti Online -> pakaian apa".
  const pakaianByDate = {};
  pakaian.forEach((p) => { if (p.tarikh) (pakaianByDate[p.tarikh] = pakaianByDate[p.tarikh] || []).push(p); });

  const teachingEvents = [];
  jadual.forEach((j) => { if (j.tarikh) teachingEvents.push({ id: `j-${j.id}`, tarikh: j.tarikh, jenis: j.jenis, tajuk: j.tajuk, masa: j.masa, isGanti: false }); });
  ganti.forEach((g) => { if (g.selesai && g.tarikhGanti) teachingEvents.push({ id: `g-${g.id}`, tarikh: g.tarikhGanti, jenis: "Kelas Ganti", tajuk: g.kelasAsal, masa: g.masaGanti, isGanti: true }); });
  teachingEvents.sort((a, b) => (a.tarikh < b.tarikh ? 1 : a.tarikh > b.tarikh ? -1 : 0));

  const konteksList = ["Kuliah", "Kelas Online", "Praktikum", "Lain-lain"];
  const pakaianByKonteks = konteksList.map((k) => ({ label: k, count: pakaian.filter((p) => p.konteks === k).length })).filter((k) => k.count > 0);

  const tiles = [
    { label: "Jumlah Jadual", val: jadual.length, a: ACCENTS.jadual },
    { label: "Ganti Belum Selesai", val: gantiBelum, a: ACCENTS.ganti },
    { label: "Hadir Belum Disahkan", val: hadir.filter((i) => i.status === "Belum Disahkan").length, a: ACCENTS.hadir },
    { label: "Rekod Pakaian", val: pakaian.length, a: ACCENTS.pakaian },
  ];

  return (
    <SectionShell id="rumusan" accent={accent} icon={BarChart3} tag="Rumusan"
      title="Rumusan & Analisis"
      subtitle="Gambaran keseluruhan semua data dalam satu paparan"
      count={totalSemua}>
      <div className="mb-5 grid grid-cols-2 gap-2 sm:grid-cols-4">
        {tiles.map((s) => (
          <div key={s.label} className="rounded-xl border border-black/[0.06] p-3" style={{ backgroundColor: s.a.tint }}>
            <p className="text-[24px] leading-none" style={{ fontFamily: "'Fraunces', Georgia, serif", fontWeight: 600, color: s.a.deep }}>{s.val}</p>
            <p className="mt-1 text-[11px] leading-snug text-black/45">{s.label}</p>
          </div>
        ))}
      </div>

      {totalSemua === 0 ? (
        <EmptyRow text="Belum ada data untuk dianalisis." />
      ) : (
        <div className="space-y-5">
          {ganti.length > 0 && (
            <div>
              <p className="mb-2 text-[11px] font-semibold uppercase tracking-wider text-black/35">Status Kelas Ganti</p>
              <div className="space-y-2">
                <StatBar label="Sudah Diganti" count={gantiSudah} total={ganti.length} color={ACCENTS.jadual.mid} />
                <StatBar label="Belum Diganti" count={gantiBelum} total={ganti.length} color={ACCENTS.ganti.mid} />
              </div>
            </div>
          )}

          {hadir.length > 0 && (
            <div>
              <p className="mb-2 text-[11px] font-semibold uppercase tracking-wider text-black/35">Ketidakhadiran mengikut Status</p>
              <div className="space-y-2">
                {hadirByStatus.map((s) => (
                  <StatBar key={s.label} label={s.label} count={s.count} total={hadir.length} color={ACCENTS.hadir.mid} />
                ))}
              </div>
            </div>
          )}

          {jadualByJenis.length > 0 && (
            <div>
              <p className="mb-2 text-[11px] font-semibold uppercase tracking-wider text-black/35">Jadual mengikut Jenis</p>
              <div className="space-y-2">
                {jadualByJenis.map((j) => (
                  <StatBar key={j.label} label={j.label} count={j.count} total={jadual.length} color={ACCENTS.jadual.mid} />
                ))}
              </div>
            </div>
          )}

          {teachingDatesArr.length > 0 && (
            <div>
              <p className="mb-2 text-[11px] font-semibold uppercase tracking-wider text-black/35">
                Liputan Rekod Pakaian pada Hari Mengajar
              </p>
              <p className="mb-2 text-[11px] text-black/35">Jadual + kelas ganti yang sudah selesai, dipadankan dengan tarikh rekod pakaian</p>
              <StatBar label="Hari mengajar ada rekod pakaian" count={liputanCount} total={teachingDatesArr.length} color={ACCENTS.pakaian.mid} />
              {liputanMissing.length > 0 && (
                <div className="mt-2.5">
                  <p className="mb-1.5 text-[11px] text-black/40">Belum ada rekod pakaian pada:</p>
                  <div className="flex flex-wrap gap-1.5">
                    {liputanMissing.slice(0, 8).map((d) => (
                      <span key={d} className="rounded-full px-2 py-0.5 text-[11px] font-medium" style={{ backgroundColor: ACCENTS.pakaian.tint, color: ACCENTS.pakaian.deep }}>
                        {d}
                      </span>
                    ))}
                    {liputanMissing.length > 8 && (
                      <span className="self-center text-[11px] text-black/35">+{liputanMissing.length - 8} lagi</span>
                    )}
                  </div>
                </div>
              )}
            </div>
          )}

          {teachingEvents.length > 0 && (
            <div>
              <p className="mb-2 text-[11px] font-semibold uppercase tracking-wider text-black/35">Jadual & Kelas Ganti bersama Pakaian</p>
              <p className="mb-2 text-[11px] text-black/35">Setiap hari mengajar dipadankan terus dengan pakaian pada tarikh yang sama</p>
              <ul className="space-y-1.5">
                {teachingEvents.slice(0, 12).map((ev) => {
                  const matches = pakaianByDate[ev.tarikh] || [];
                  return (
                    <li key={ev.id} className="rounded-lg bg-black/[0.02] px-3 py-2">
                      <div className="flex flex-wrap items-center gap-x-2 gap-y-0.5 text-[12px]">
                        <span className="font-semibold" style={{ color: ev.isGanti ? ACCENTS.ganti.mid : ACCENTS.jadual.mid }}>{ev.tarikh}</span>
                        <span className="text-black/25">·</span>
                        <span className="truncate text-black/60">{ev.jenis}{ev.tajuk ? ` — ${ev.tajuk}` : ""}{ev.masa ? ` (${ev.masa})` : ""}</span>
                      </div>
                      <div className="mt-1 text-[12.5px]">
                        {matches.length > 0 ? (
                          <span className="text-black/80">👕 {matches.map((m) => m.pakaian).filter(Boolean).join(", ")}</span>
                        ) : (
                          <span className="italic text-black/30">Tiada rekod pakaian</span>
                        )}
                      </div>
                    </li>
                  );
                })}
              </ul>
              {teachingEvents.length > 12 && (
                <p className="mt-2 text-[11px] text-black/35">+{teachingEvents.length - 12} entri lagi — guna "Eksport Semua" untuk senarai penuh</p>
              )}
            </div>
          )}

          {pakaianByKonteks.length > 0 && (
            <div>
              <p className="mb-2 text-[11px] font-semibold uppercase tracking-wider text-black/35">Rekod Pakaian mengikut Jenis Kelas</p>
              <div className="space-y-2">
                {pakaianByKonteks.map((k) => (
                  <StatBar key={k.label} label={k.label} count={k.count} total={pakaian.length} color={ACCENTS.pakaian.mid} />
                ))}
              </div>
            </div>
          )}

          {topAbsent.length > 0 && (
            <div>
              <p className="mb-2 text-[11px] font-semibold uppercase tracking-wider text-black/35">Pelajar Paling Kerap Tidak Hadir</p>
              <ul className="space-y-1.5">
                {topAbsent.map(([nama, count]) => (
                  <li key={nama} className="flex items-center justify-between rounded-lg bg-black/[0.02] px-3 py-2 text-[13px]">
                    <span className="truncate text-black/80">{nama}</span>
                    <span className="shrink-0 rounded-full px-2 py-0.5 text-[11px] font-semibold text-white" style={{ backgroundColor: ACCENTS.hadir.mid }}>{count}×</span>
                  </li>
                ))}
              </ul>
            </div>
          )}
        </div>
      )}
    </SectionShell>
  );
}

const NAV = [
  { id: "jadual", label: "Jadual", accent: ACCENTS.jadual, icon: Calendar },
  { id: "ganti", label: "Ganti", accent: ACCENTS.ganti, icon: RefreshCw },
  { id: "ketidakhadiran", label: "Hadir", accent: ACCENTS.hadir, icon: UserX },
  { id: "pakaian", label: "Pakaian", accent: ACCENTS.pakaian, icon: Shirt },
  { id: "rumusan", label: "Rumusan", accent: ACCENTS.rumusan, icon: BarChart3 },
];

function Dashboard() {
  const jadual = useCollection("jadual-items");
  const ganti = useCollection("kelas-ganti");
  const hadir = useCollection("ketidakhadiran");
  const pakaian = useCollection("pakaian-log");
  const [showRaw, setShowRaw] = useState(false);

  const scrollTo = (id) => document.getElementById(id)?.scrollIntoView({ behavior: "smooth", block: "start" });

  const exportAll = () => {
    const pairs = [
      [jadual.items, "jadual"],
      [ganti.items, "ganti"],
      [hadir.items, "hadir"],
      [pakaian.items, "pakaian"],
    ];
    // Sedikit jeda antara setiap muat turun supaya pelayar tidak sekat
    // pop-up bila 4 fail dimuat turun serentak.
    pairs.forEach(([items, key], i) => {
      const cfg = CSV_CONFIGS[key];
      setTimeout(() => downloadCSV(cfg.filename, cfg.headers, (items || []).map(cfg.map)), i * 350);
    });
  };

  return (
    <div
      className="min-h-screen pb-16"
      style={{
        fontFamily: "'Inter', -apple-system, BlinkMacSystemFont, sans-serif",
        backgroundColor: "#101826",
        backgroundImage: [
          "radial-gradient(ellipse 900px 480px at 50% -10%, rgba(45,212,191,0.10), transparent 60%)",
          "repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 44px)",
          "repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 44px)",
        ].join(", "),
      }}
    >
      {/* ---- Hero: latar gambar studio drafting dari Unsplash ---- */}
      <div
        className="relative flex min-h-[210px] flex-col justify-end bg-cover bg-center px-4 pb-6 pt-12 sm:min-h-[280px] sm:pb-8 sm:pt-16"
        style={{
          backgroundImage: [
            "linear-gradient(180deg, rgba(16,24,38,0.35) 0%, rgba(16,24,38,0.55) 55%, #101826 100%)",
            'url("https://images.unsplash.com/photo-1782290547018-8bb89b8edf07?q=80&w=1600&auto=format&fit=crop")',
          ].join(", "),
        }}
      >
        <div className="mx-auto flex w-full max-w-3xl items-end gap-3">
          <div className="flex h-12 w-12 shrink-0 items-center justify-center rounded-full backdrop-blur-sm sm:h-14 sm:w-14" style={{ backgroundColor: "#2DD4BF2E", color: "#5EEAD4" }}>
            <PenTool size={22} strokeWidth={2} />
          </div>
          <div>
            <h1
              className="text-[30px] leading-none tracking-tight text-white drop-shadow-sm sm:text-[38px]"
              style={{ fontFamily: "'Fraunces', Georgia, serif", fontStyle: "italic", fontWeight: 500 }}
            >
              SHG Management Dashboard
            </h1>
            <p className="mt-1.5 text-[12.5px] tracking-wide text-white/60 sm:text-[13px]">Papan Studio Pengajaran — empat perkara, satu paparan</p>
          </div>
        </div>
      </div>

      {/* ---- Bar nav sticky: pil bahagian + tindakan ---- */}
      <header className="sticky top-0 z-20 border-b border-white/[0.06] backdrop-blur-md" style={{ backgroundColor: "rgba(16,24,38,0.9)" }}>
        <div className="mx-auto max-w-3xl px-4 pt-3">
          <div className="flex flex-wrap items-center justify-end gap-2.5">
            <button
              onClick={() => setShowRaw(true)}
              className="flex items-center gap-1.5 rounded-full border border-white/10 bg-white/[0.06] px-3 py-1.5 text-[12px] font-semibold text-white/75 transition hover:bg-white/[0.12] hover:text-white"
            >
              <Eye size={13} /> Data Mentah
            </button>
            <button
              onClick={exportAll}
              className="flex items-center gap-1.5 rounded-full border border-white/10 bg-white/[0.06] px-3 py-1.5 text-[12px] font-semibold text-white/75 transition hover:bg-white/[0.12] hover:text-white"
            >
              <Download size={13} /> Eksport Semua
            </button>
          </div>
        </div>
        <nav className="mx-auto mt-3 flex max-w-3xl gap-2 overflow-x-auto px-4 pb-4">
          {NAV.map((n) => (
            <button
              key={n.id}
              onClick={() => scrollTo(n.id)}
              className="flex shrink-0 items-center gap-1.5 rounded-full px-3.5 py-1.5 text-[12.5px] font-semibold transition hover:brightness-110"
              style={{ backgroundColor: `${n.accent.glow}1F`, color: n.accent.glow, border: `1px solid ${n.accent.glow}33` }}
            >
              <n.icon size={13} /> {n.label}
            </button>
          ))}
        </nav>
      </header>

      <main className="mx-auto max-w-3xl space-y-8 px-4 pt-6">
        <JadualSection items={jadual.items} setItems={jadual.setItems} error={jadual.error} />
        <GantiSection items={ganti.items} setItems={ganti.setItems} error={ganti.error} />
        <KetidakhadiranSection items={hadir.items} setItems={hadir.setItems} error={hadir.error} />
        <PakaianSection items={pakaian.items} setItems={pakaian.setItems} error={pakaian.error} />
        <RumusanSection
          jadual={jadual.items || []}
          ganti={ganti.items || []}
          hadir={hadir.items || []}
          pakaian={pakaian.items || []}
        />
      </main>

      <p className="mx-auto mt-10 max-w-3xl px-4 text-center text-[11px] tracking-wide text-white/25">
        SHG Management Dashboard · data disimpan secara peribadi pada peranti ini
      </p>

      {showRaw && (
        <RawDataModal
          onClose={() => setShowRaw(false)}
          groups={[
            { key: "jadual-items", label: "Jadual", accent: ACCENTS.jadual, items: jadual.items },
            { key: "kelas-ganti", label: "Ganti", accent: ACCENTS.ganti, items: ganti.items },
            { key: "ketidakhadiran", label: "Ketidakhadiran", accent: ACCENTS.hadir, items: hadir.items },
            { key: "pakaian-log", label: "Pakaian", accent: ACCENTS.pakaian, items: pakaian.items },
          ]}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Dashboard />);
</script>
</body>
